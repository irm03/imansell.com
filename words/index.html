<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Words · Isaac Mansell</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root { --paper: #ffffff; --ink: #000000; color-scheme: light; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Times New Roman", Times, "Liberation Serif", serif;
    margin: 0; box-sizing: border-box;
    padding: clamp(48px, 11vh, 120px) max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-weight: normal; font-size: clamp(30px, 4vw, 40px); margin: 0; }
  h1 a { color: var(--ink); text-decoration: none; }
  h1 a:hover { text-decoration: underline; }
  /* words flow down each column: 4 columns of 15 on computers, 2 on phones */
  ul {
    list-style: none; margin: clamp(40px, 7vh, 72px) 0 0; padding: 0;
    columns: 4; column-gap: clamp(40px, 6vw, 96px);
    font-size: 20px; line-height: 1.6;
  }
  li { break-inside: avoid; }
  @media (max-width: 720px) { ul { columns: 2; column-gap: 40px; font-size: 18px; } }
</style>
</head>
<body>
<h1><a href="../">Isaac Mansell</a></h1>
<ul id="words"></ul>
<script src="words.js"></script>
<script>
  const list = document.getElementById("words");
  [...new Set((window.WORDS || []).map((w) => w.trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b))
    .forEach((w) => {
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = w;
      li.appendChild(span);
      list.appendChild(li);
    });

  // ---------- Tsujigiri ----------
  // Hover over it with a mouse and it sprouts legs and a katana, walks to a random word,
  // cuts it in half, and walks back. It keeps going for as long as the mouse stays on its spot,
  // and always finishes the trip it is on. When every word is gone, it comes for the name.
  // Clicks and taps do nothing. Reloading the page brings everything back.
  (function () {
    const home = [...list.querySelectorAll("li > span")].find((s) => s.textContent === "Tsujigiri");
    if (!home) return;
    const nameLink = document.querySelector("h1 a");
    const NS = "http://www.w3.org/2000/svg";
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const BASE_SPEED = reduce ? 900 : 150;     // walking speed, px per second
    const BASE_T = reduce ? 0.3 : 1;           // timing scale for the sword work
    // ↑ / ↓ speed him up or slow him down. Undocumented on purpose; it carries over until reload.
    const PACES = [0.5, 0.75, 1, 1.5, 2, 3, 4, 6, 8, 12];
    let pace = 2;                              // index into PACES (1×)
    const speed = () => BASE_SPEED * PACES[pace];
    const T = () => BASE_T / PACES[pace];
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" && pace < PACES.length - 1) { pace++; e.preventDefault(); }
      else if (e.key === "ArrowDown" && pace > 0) { pace--; e.preventDefault(); }
    });
    const PAD = 46;                            // room around the word for limbs

    let hovering = false, running = false;
    const zone = home.parentElement;            // the whole row, so a quick pass still lands on it
    zone.style.cursor = "default";
    home.style.userSelect = "none"; home.style.webkitUserSelect = "none";
    const enter = (e) => {
      if (e.pointerType && e.pointerType !== "mouse") return;
      hovering = true;
      if (!running) run();
    };
    zone.addEventListener("pointerenter", enter);
    zone.addEventListener("pointermove", enter);
    zone.addEventListener("pointerleave", (e) => { if (!e.pointerType || e.pointerType === "mouse") hovering = false; });

    // a crescent moon rises while he is out
    const night = document.createElementNS(NS, "svg");
    night.setAttribute("aria-hidden", "true");
    night.setAttribute("viewBox", "0 0 40 40");
    night.innerHTML = '<path d="M26 5 A16 16 0 1 0 35 30 A13 13 0 1 1 26 5 Z" fill="#000"/>';
    night.style.cssText = "position:fixed;top:calc(28px + env(safe-area-inset-top, 0px));right:calc(32px + env(safe-area-inset-right, 0px));width:34px;height:34px;opacity:0;pointer-events:none;z-index:30;transition:opacity 700ms ease;";
    document.body.appendChild(night);

    const walker = document.createElement("div");
    walker.setAttribute("aria-hidden", "true");
    walker.style.cssText = "position:absolute;left:0;top:0;z-index:50;pointer-events:none;white-space:nowrap;";
    const text = document.createElement("span");
    text.textContent = home.textContent;
    const svg = document.createElementNS(NS, "svg");
    svg.style.cssText = "position:absolute;overflow:visible;pointer-events:none;";
    walker.append(text, svg);
    walker.hidden = true;
    document.body.appendChild(walker);

    let W = 0, H = 0, x = 0, y = 0, facing = 1, grow = 0, legPhase = 0, arm = -0.9;

    const box = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + scrollX, y: r.top + scrollY, w: r.width, h: r.height }; };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const tween = (ms, fn) => new Promise((done) => {
      const t0 = performance.now();
      (function f(now) {
        const t = Math.min(1, (now - t0) / ms);
        fn(t);
        t < 1 ? requestAnimationFrame(f) : done();
      })(t0);
    });

    function place() { walker.style.left = x + "px"; walker.style.top = y + "px"; }

    function draw() {
      const cx = PAD + W / 2;
      const fx = (px) => (facing === 1 ? px : 2 * cx - px);   // mirror when facing left
      const L = (x1, y1, x2, y2, w = 1.2) => `<line x1="${fx(x1).toFixed(1)}" y1="${y1.toFixed(1)}" x2="${fx(x2).toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#000" stroke-width="${w}" stroke-linecap="round"/>`;
      let out = "";
      if (grow > 0) {
        // legs
        const hipY = H - 3, foot = H - 3 + 22 * grow, s = Math.sin(legPhase) * 7 * grow;
        out += L(cx - 4, hipY, cx - 4 - s, foot) + L(cx + 4, hipY, cx + 4 + s, foot);
        // arm, hand and katana
        const sx = PAD + W - 2, sy = H * 0.5;
        const hx = sx + Math.cos(arm) * 13 * grow, hy = sy + Math.sin(arm) * 13 * grow;
        const b = arm - 0.6, len = 36 * grow;
        const gx = hx + Math.cos(b) * 4 * grow, gy = hy + Math.sin(b) * 4 * grow;
        out += L(sx, sy, hx, hy);
        out += `<circle cx="${fx(hx).toFixed(1)}" cy="${hy.toFixed(1)}" r="${(2.2 * grow).toFixed(1)}" fill="#fff" stroke="#000" stroke-width="1"/>`;
        out += L(hx - Math.cos(b) * 5 * grow, hy - Math.sin(b) * 5 * grow, gx, gy, 2);                 // hilt
        const px = Math.cos(b + Math.PI / 2) * 4 * grow, py = Math.sin(b + Math.PI / 2) * 4 * grow;
        out += L(gx - px, gy - py, gx + px, gy + py, 1.4);                                              // guard
        out += L(gx, gy, gx + Math.cos(b) * len, gy + Math.sin(b) * len, 1.6);                          // blade
      }
      svg.innerHTML = out;
    }

    function walkTo(getDest) {
      return new Promise((done) => {
        let last = performance.now();
        (function f(now) {
          const dt = Math.min(0.05, (now - last) / 1000); last = now;
          const d = getDest();
          const dx = d.x - x, dy = d.y - y, dist = Math.hypot(dx, dy), step = speed() * dt;
          if (Math.abs(dx) > 1) facing = dx > 0 ? 1 : -1;
          if (dist <= step) { x = d.x; y = d.y; place(); draw(); done(); return; }
          x += (dx / dist) * step; y += (dy / dist) * step;
          legPhase += step * 0.16;
          place(); draw();
          requestAnimationFrame(f);
        })(last);
      });
    }

    function homeSpot() { const b = box(home); return { x: b.x, y: b.y }; }

    function besideSpot(el) {
      const b = box(el), here = x + W / 2, maxX = document.documentElement.scrollWidth - W - 4;
      const left = b.x - W - 18, right = b.x + b.w + 18;
      let side = b.x + b.w / 2 >= here ? -1 : 1;              // approach from the near side
      if (side === -1 && left < 4) side = 1;
      if (side === 1 && right > maxX) side = -1;
      return { x: side === -1 ? left : right, y: b.y + b.h - H, face: side === -1 ? 1 : -1 };
    }

    function pickTarget() {
      const left = [...list.querySelectorAll("li > span")].filter((s) => s !== home && !s.dataset.cut);
      if (left.length) return left[Math.floor(Math.random() * left.length)];
      if (nameLink && !nameLink.dataset.cut) return nameLink;
      return null;
    }

    function cut(el) {
      const b = box(el), cs = getComputedStyle(el);
      el.dataset.cut = "1";
      el.style.visibility = "hidden";
      if (el === nameLink) { el.removeAttribute("href"); el.setAttribute("aria-hidden", "true"); el.tabIndex = -1; }
      const piece = (clip, frames) => {
        const p = document.createElement("div");
        p.textContent = el.textContent;
        p.setAttribute("aria-hidden", "true");
        p.style.cssText = `position:absolute;left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;font:${cs.font};line-height:${b.h}px;white-space:nowrap;color:#000;pointer-events:none;z-index:40;clip-path:${clip};`;
        document.body.appendChild(p);
        p.animate(frames, { duration: 1100 * T() + 300, easing: "cubic-bezier(.4,0,.8,.6)", fill: "forwards" }).onfinish = () => p.remove();
      };
      piece("polygon(0 0,100% 0,100% 38%,0 62%)", [
        { transform: "none", opacity: 1 },
        { transform: "translate(6px,-4px) rotate(-5deg)", opacity: 1, offset: 0.2 },
        { transform: "translate(14px,70px) rotate(-14deg)", opacity: 0 }]);
      piece("polygon(0 62%,100% 38%,100% 100%,0 100%)", [
        { transform: "none", opacity: 1 },
        { transform: "translate(-3px,3px) rotate(3deg)", opacity: 1, offset: 0.2 },
        { transform: "translate(-8px,60px) rotate(10deg)", opacity: 0 }]);
      // the stroke of the cut
      const s = document.createElementNS(NS, "svg");
      s.setAttribute("aria-hidden", "true");
      s.style.cssText = `position:absolute;left:${b.x - 8}px;top:${b.y}px;width:${b.w + 16}px;height:${b.h}px;overflow:visible;pointer-events:none;z-index:41;`;
      s.innerHTML = `<line x1="0" y1="${b.h * 0.66}" x2="${b.w + 16}" y2="${b.h * 0.34}" stroke="#000" stroke-width="1"/>`;
      document.body.appendChild(s);
      s.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400 }).onfinish = () => s.remove();
    }

    async function slash(el) {
      await tween(160 * T(), (t) => { arm = -0.9 - 0.8 * t; draw(); });           // raise
      let done = false;
      await tween(200 * T(), (t) => { arm = -1.7 + 2.7 * t; if (t > 0.5 && !done) { done = true; cut(el); } draw(); });
      await wait(260 * T());
      await tween(220 * T(), (t) => { arm = 1.0 - 1.9 * t; draw(); });             // back to rest
    }

    async function run() {
      if (!pickTarget()) return;
      running = true;
      const cs = getComputedStyle(home);
      text.style.font = cs.font;
      const r = home.getBoundingClientRect();
      W = r.width; H = r.height;
      svg.setAttribute("width", W + PAD * 2); svg.setAttribute("height", H + 34);
      svg.style.left = -PAD + "px"; svg.style.top = "0px";
      ({ x, y } = homeSpot());
      facing = 1; arm = -0.9; grow = 0;
      place(); draw();
      walker.hidden = false;
      home.style.opacity = "0";
      night.style.opacity = "1";
      await tween(320, (t) => { grow = t; draw(); });                          // sprout

      let first = true;                                // even a quick pass gets one full trip
      while (first || hovering) {
        first = false;
        const target = pickTarget();
        if (!target) break;
        await walkTo(() => besideSpot(target));
        facing = besideSpot(target).face; draw();
        await wait(120 * T());
        await slash(target);
        await wait(180 * T());
        await walkTo(homeSpot);
        facing = 1; draw();
        await wait(250);
      }

      night.style.opacity = "0";
      await tween(320, (t) => { grow = 1 - t; draw(); });                      // retract
      walker.hidden = true;
      home.style.opacity = "";
      running = false;
      if (hovering && pickTarget()) run();
    }
  })();
</script>
</body>
</html>
